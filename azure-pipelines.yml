# Invoice Canvas Playwright — manual E2E only.
# Does not run on git push or PRs. After ApplicationComponents deploy + post-deploy:
# Pipelines → Invoice-E2E → Run pipeline → pick Environment + Tests to run.
trigger: none
pr: none

parameters:
  - name: targetEnv
    displayName: Environment
    type: string
    default: dev
    values:
      - dev
      - qa
      - sit
      - uat
  - name: testSuite
    displayName: Tests to run
    type: string
    default: smoke
    values:
      - smoke
      - dashboard
      - overview
      - create-invoice
      - all-main
  - name: testGrep
    displayName: Single-case filter (Playwright --grep). Keep 'none' to run the whole suite.
    type: string
    default: 'none'
  - name: runPm
    displayName: Also run the same tests as PM (needs auth-<env>-pm.json)
    type: boolean
    default: false

jobs:
  - job: Playwright
    timeoutInMinutes: 180
    pool:
      vmImage: ubuntu-latest
    variables:
      - group: invoice-e2e-${{ parameters.targetEnv }}

    steps:
      - checkout: self

      - task: NodeTool@0
        displayName: Use Node 20
        inputs:
          versionSpec: '20.x'

      - task: DownloadSecureFile@1
        name: adminAuth
        displayName: Download Admin storageState
        inputs:
          secureFile: 'auth-${{ parameters.targetEnv }}-admin.json'

      - ${{ if eq(parameters.runPm, true) }}:
          - task: DownloadSecureFile@1
            name: pmAuth
            displayName: Download PM storageState
            inputs:
              secureFile: 'auth-${{ parameters.targetEnv }}-pm.json'

      - script: |
          set -e
          mkdir -p "auth/${TARGET_ENV}"
          cp "$(adminAuth.secureFilePath)" "auth/${TARGET_ENV}/admin.json"
        displayName: Place auth/<env>/admin.json
        env:
          TARGET_ENV: ${{ parameters.targetEnv }}

      - ${{ if eq(parameters.runPm, true) }}:
          - script: |
              set -e
              mkdir -p "auth/${TARGET_ENV}"
              cp "$(pmAuth.secureFilePath)" "auth/${TARGET_ENV}/pm.json"
            displayName: Place auth/<env>/pm.json
            env:
              TARGET_ENV: ${{ parameters.targetEnv }}

      - script: npm ci
        displayName: npm ci

      - script: npx playwright install --with-deps chromium
        displayName: Install Playwright Chromium

      - script: |
          set -e
          case "${SUITE}" in
            smoke) FILES="tests/smoke.spec.ts" ;;
            dashboard) FILES="tests/dashboard-screen.spec.ts" ;;
            overview) FILES="tests/invoice-overview-screen.spec.ts" ;;
            create-invoice) FILES="tests/create-invoice-screen.spec.ts" ;;
            all-main)
              FILES="tests/dashboard-screen.spec.ts tests/invoice-overview-screen.spec.ts tests/create-invoice-screen.spec.ts"
              ;;
            *)
              echo "Unknown SUITE=${SUITE}"
              exit 1
              ;;
          esac
          echo "Admin suite=${SUITE} files=${FILES} grep='${GREP}'"
          if [ -n "${GREP}" ] && [ "${GREP}" != "none" ]; then
            npx playwright test ${FILES} --project=chromium-admin --retries=0 --grep "${GREP}"
          else
            npx playwright test ${FILES} --project=chromium-admin --retries=0
          fi
        displayName: Run Admin Playwright suite
        env:
          ENV: $(ENV)
          CI: $(CI)
          SUITE: ${{ parameters.testSuite }}
          GREP: ${{ parameters.testGrep }}

      - ${{ if eq(parameters.runPm, true) }}:
          - script: |
              set -e
              case "${SUITE}" in
                smoke) FILES="tests/smoke.spec.ts" ;;
                dashboard) FILES="tests/dashboard-screen.spec.ts" ;;
                overview) FILES="tests/invoice-overview-screen.spec.ts" ;;
                create-invoice) FILES="tests/create-invoice-screen.spec.ts" ;;
                all-main)
                  FILES="tests/dashboard-screen.spec.ts tests/invoice-overview-screen.spec.ts tests/create-invoice-screen.spec.ts"
                  ;;
                *)
                  echo "Unknown SUITE=${SUITE}"
                  exit 1
                  ;;
              esac
              echo "PM suite=${SUITE} files=${FILES} grep='${GREP}'"
              if [ -n "${GREP}" ] && [ "${GREP}" != "none" ]; then
                npx playwright test ${FILES} --project=chromium-pm --retries=0 --grep "${GREP}"
              else
                npx playwright test ${FILES} --project=chromium-pm --retries=0
              fi
            displayName: Run PM Playwright suite
            env:
              ENV: $(ENV)
              CI: $(CI)
              SUITE: ${{ parameters.testSuite }}
              GREP: ${{ parameters.testGrep }}

      - task: PublishTestResults@2
        displayName: Publish JUnit results (Tests tab)
        condition: always()
        inputs:
          testResultsFormat: JUnit
          testResultsFiles: '**/junit.xml'
          mergeTestResults: true
          publishRunAttachments: true
          testRunTitle: 'Invoice E2E $(ENV) ${{ parameters.testSuite }}'

      - script: |
          set -e
          {
            echo "# How to read this run"
            echo ""
            echo "- **Tests tab** (this run): pass/fail per case. Pipeline list = history of every run."
            echo "- Do **not** click \`index.html\` in Artifacts — Azure downloads it alone, so screenshots/videos break."
            echo "- Download the **whole** \`playwright-html-report\` zip, unzip, then locally:"
            echo "  \`npx playwright show-report playwright-report\`"
            echo "- Failed traces: download \`playwright-test-results\`, open \`*.zip\` on https://trace.playwright.dev"
          } > "$(Build.SourcesDirectory)/ado-report-help.md"
          echo "##vso[task.uploadsummary]$(Build.SourcesDirectory)/ado-report-help.md"
        displayName: Add report help on the Summary tab
        condition: always()

      - task: PublishPipelineArtifact@1
        displayName: Publish HTML report folder
        condition: always()
        inputs:
          targetPath: playwright-report
          artifact: playwright-html-report
          publishLocation: pipeline

      - task: PublishPipelineArtifact@1
        displayName: Publish screenshots videos traces
        condition: always()
        inputs:
          targetPath: test-results
          artifact: playwright-test-results
          publishLocation: pipeline
